<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามสถานะโครงร่างวิจัย | คณะพยาบาลศาสตร์ มรภ.ศรีสะเกษ</title>
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<link rel="stylesheet" href="common.css">
<style>
.main{max-width:760px;margin:0 auto;padding-block:28px 10px;display:flex;flex-direction:column;gap:18px}
.lookup{padding:22px 24px;display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.lookup h2{grid-column:1/-1;font-size:21px}
.lookup p{grid-column:1/-1;margin:-6px 0 4px}
@media (max-width:640px){.lookup{grid-template-columns:1fr;padding:18px 16px}}
.result{padding:22px 24px}
@media (max-width:640px){.result{padding:18px 16px}}
.r-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.r-ref{font-family:var(--f-display);color:var(--orange);font-weight:600;letter-spacing:.03em}
.r-title{font-size:19px;margin-top:2px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.meta div{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);min-width:0}
.meta b{display:block;color:var(--ink);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:560px){.meta{grid-template-columns:1fr}}
.track{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:8px 0 20px;position:relative}
.track .st{text-align:center;font-size:12.5px;color:var(--muted);position:relative;padding-top:30px}
.track .st::before{content:"";position:absolute;top:8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--paper);border:2px solid var(--line);z-index:1}
.track .st::after{content:"";position:absolute;top:16px;left:-50%;width:100%;height:2px;background:var(--line)}
.track .st:first-child::after{display:none}
.track .st.on{color:var(--ink);font-weight:600}
.track .st.on::before{background:var(--green);border-color:var(--green)}
.track .st.on::after{background:var(--green)}
.track .st.end-fix::before{background:var(--s-fix);border-color:var(--s-fix)}
.track .st.end-fail::before{background:var(--s-fail);border-color:var(--s-fail)}
.note{border-left:3px solid var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--paper));padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:18px;white-space:pre-wrap}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:grid;grid-template-columns:150px 1fr;gap:12px;font-size:14px}
.hist time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.hist li{grid-template-columns:1fr;gap:2px}}
</style>
</head>
<body>
<header class="crest">
  <div class="wrap">
    <img src="logo.jpg" alt="ตราคณะพยาบาลศาสตร์ มหาวิทยาลัยราชภัฏศรีสะเกษ">
    <div><h1>ติดตามสถานะโครงร่างวิจัย</h1><p>คณะพยาบาลศาสตร์ มหาวิทยาลัยราชภัฏศรีสะเกษ</p></div>
    <nav class="topnav" aria-label="เมนูหลัก"><a href="./">เสนอโครงร่าง</a><a href="track.html" aria-current="page">ติดตามสถานะ</a><a href="dashboard.html">สรุปภาพรวม</a></nav>
  </div>
</header>

<div class="wrap">
  <main class="main">
    <form class="card lookup" id="f">
      <h2>ตรวจสอบผลการพิจารณา</h2>
      <p class="hint">กรอกเลขที่โครงร่างที่ได้รับหลังส่ง (เช่น NUR-2570-001) และอีเมลหัวหน้าโครงการที่ใช้ตอนส่ง</p>
      <label class="f">เลขที่โครงร่าง<input type="text" id="ref" autocomplete="off" placeholder="NUR-2570-001" required></label>
      <label class="f">อีเมลหัวหน้าโครงการ<input type="email" id="email" autocomplete="email" placeholder="name@sskru.ac.th" required></label>
      <button class="btn btn-p" id="go" type="submit">ตรวจสอบ</button>
    </form>
    <div id="out" aria-live="polite"></div>
  </main>
  <footer>งานวิจัยและบริการวิชาการ คณะพยาบาลศาสตร์ มหาวิทยาลัยราชภัฏศรีสะเกษ</footer>
</div>

<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s);
const API_URL=((window.APP_CONFIG||{}).API_URL||'').trim();
const LIVE=/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL);
const esc=v=>String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=s=>{if(!s)return'—';const d=new Date(s);return isNaN(d)?esc(s):d.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})};
async function api(action,data){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,data:data||{}})});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'เกิดข้อผิดพลาด'); return j.result;
}
const SAMPLE={ref:'NUR-2570-001',submitted:'2026-11-03T02:10:00Z',status:'ให้แก้ไข',fy:'2570',title:'(ตัวอย่าง) ผลของโปรแกรมส่งเสริมการรับรู้ความสามารถของตนเองต่อพฤติกรรมการดูแลผู้สูงอายุติดเตียงของ อสม.',lead:'อาจารย์ (ตัวอย่าง) สมใจ ใจดี',total:19500,note:'กรุณาเพิ่มรายละเอียดการคำนวณขนาดกลุ่มตัวอย่าง และแนบแบบสอบถามฉบับสมบูรณ์',updated:'2026-11-04T07:30:00Z',history:[{status:'รอพิจารณา',note:'ได้รับโครงร่าง',at:'2026-11-03T02:10:00Z'},{status:'กำลังพิจารณา',note:'ส่งผู้ทรงคุณวุฒิ',at:'2026-11-03T09:00:00Z'},{status:'ให้แก้ไข',note:'กรุณาเพิ่มรายละเอียดการคำนวณขนาดกลุ่มตัวอย่าง และแนบแบบสอบถามฉบับสมบูรณ์',at:'2026-11-04T07:30:00Z'}]};
function render(r){
  const st=r.status, idx={'รอพิจารณา':0,'กำลังพิจารณา':1}[st]??2;
  const endCls=st==='ให้แก้ไข'?'end-fix':st==='ไม่ผ่านการพิจารณา'?'end-fail':'';
  const endLabel=idx===2?st:'ผลการพิจารณา';
  $('#out').innerHTML=`<section class="card result">
    <div class="r-head"><div><div class="r-ref">${esc(r.ref)}</div><h3 class="r-title">${esc(r.title)}</h3></div><span class="pill s-${esc(st)}">${esc(st)}</span></div>
    <div class="meta"><div>หัวหน้าโครงการ<b>${esc(r.lead)}</b></div><div>วันที่ส่ง<b>${fmtDate(r.submitted)}</b></div><div>งบประมาณที่เสนอ<b>${Number(r.total||0).toLocaleString('th-TH')} บาท</b></div></div>
    <div class="track" aria-label="ขั้นตอนการพิจารณา">
      <div class="st on">ได้รับโครงร่าง</div><div class="st ${idx>=1?'on':''}">กำลังพิจารณา</div><div class="st ${idx>=2?'on '+endCls:''}">${esc(endLabel)}</div>
    </div>
    ${r.note?`<div class="note"><b>ความเห็นผู้พิจารณา</b>\n${esc(r.note)}</div>`:''}
    <h3 style="font-size:16px;margin-bottom:10px">ประวัติการดำเนินการ</h3>
    <ol class="hist">${(r.history||[]).slice().reverse().map(h=>`<li><time>${fmtDate(h.at)}</time><div><span class="pill s-${esc(h.status)}">${esc(h.status)}</span>${h.note?` <span class="hint">${esc(h.note)}</span>`:''}</div></li>`).join('')||'<li class="hint">ยังไม่มีประวัติ</li>'}</ol>
    ${st==='ให้แก้ไข'?`<p class="hint" style="margin-top:16px">แก้ไขตามความเห็นแล้ว ให้ส่งเอกสารฉบับแก้ไขถึงงานวิจัยคณะ หรือติดต่อผู้ดูแลระบบ</p>`:''}
  </section>`;
}
$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const ref=$('#ref').value.trim(), email=$('#email').value.trim();
  if(!ref||!email){$('#out').innerHTML='<div class="err">กรุณากรอกเลขที่โครงร่างและอีเมล</div>';return}
  if(!LIVE){render(Object.assign({},SAMPLE,{ref:ref.toUpperCase()}));$('#out').insertAdjacentHTML('afterbegin','<p class="mode">โหมดทดลอง: แสดงข้อมูลตัวอย่าง</p>');return}
  const b=$('#go'); b.disabled=true; b.textContent='กำลังตรวจสอบ…';
  try{render(await api('status',{ref,email}))}
  catch(err){$('#out').innerHTML=`<div class="err">${esc(err.message)}</div>`}
  finally{b.disabled=false;b.textContent='ตรวจสอบ'}
});
const q=new URLSearchParams(location.search); if(q.get('ref')) $('#ref').value=q.get('ref');
</script>
</body>
</html>
